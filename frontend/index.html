<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>Task Dashboard</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
<main class="page">
    <header class="header">
        <h1>Task Dashboard</h1>
        <p>רשימת משימות פעילות עבור מנהל עבודה</p>
    </header>

    <section class="summary-card">
    <div>
        <span class="label">סה״כ משימות שנשלפו</span>
        <strong id="totalTasks">-</strong>
    </div>
    <div>
        <span class="label">זמן שרת</span>
        <strong id="backendTime">-</strong>
    </div>
    <div>
        <span class="label">זמן בקשת API בדפדפן</span>
        <strong id="apiRoundTripTime">-</strong>
    </div>
    <div>
        <span class="label">זמן Render בדפדפן</span>
        <strong id="renderTime">-</strong>
    </div>
    </section>

    <section class="table-section">
        <div class="table-header">
            <h2>משימות Pending / InProgress</h2>
            <button id="reloadButton">רענון</button>
        </div>

        <div class="controls">
            <label for="renderMode">מצב תצוגה</label>
            <select id="renderMode">
                <option value="full">Full Render - הצגת כל המשימות</option>
                <option value="paginated">Paginated - הצגת 100 משימות בעמוד</option>
            </select>

            <div id="paginationControls" class="pagination-controls hidden">
                <button id="previousPageButton">הקודם</button>
                <span id="pageInfo">עמוד -</span>
                <button id="nextPageButton">הבא</button>
            </div>
        </div>

        <div id="loadingMessage" class="message">טוען משימות...</div>
        <div id="errorMessage" class="message error hidden"></div>

        <table>
            <thead>
            <tr>
                <th>TaskID</th>
                <th>Title</th>
                <th>Status</th>
                <th>Priority</th>
            </tr>
            </thead>
            <tbody id="tasksTableBody"></tbody>
        </table>
    </section>
</main>

<script src="app.js"></script>
</body>
</html>
